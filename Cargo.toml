[package]
name = "kasse0"
version = "0.1.0"
edition = "2021"
description = "KASSE 0 - liminaler Supermarkt-Horror (Prototyp)"

[dependencies]
ash = "0.38"
ash-window = "0.13"
raw-window-handle = "0.6"
winit = "0.30"
glam = { version = "0.29", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
rand = "0.8"
rand_pcg = "0.3"
font8x8 = "0.3"
rodio = { version = "0.19", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ab_glyph = "0.2"

[build-dependencies]
naga = { version = "24", features = ["wgsl-in", "spv-out"] }
serde_json = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
