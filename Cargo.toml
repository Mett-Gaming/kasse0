[package]
name = "kasse0"
version = "0.1.0"
edition = "2021"
description = "KASSE 0 - liminaler Supermarkt-Horror (Prototyp)"

[workspace]
members = [".", "mettgine", "mettgine/mpak", "mettgine/mettpack"]
# `cargo test` prueft Spiel und Engine
default-members = [".", "mettgine", "mettgine/mpak", "mettgine/mettpack"]

[dependencies]
mettgine = { path = "mettgine" }
winit = "0.30"
glam = { version = "0.29", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
rand = "0.8"
rand_pcg = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ab_glyph = "0.2"

[build-dependencies]
naga = { version = "24", features = ["wgsl-in", "spv-out"] }
serde_json = "1"

[profile.release]
# Zeilennummern fuer Absturzberichte (landen in kasse0.pdb neben der exe, nicht in der exe)
debug = "line-tables-only"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
