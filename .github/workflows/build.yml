# Baut KASSE 0 bei jedem Hochladen und jeder Übernahmeanfrage. Eine Marke "v*" erzeugt zusätzlich eine
# Veröffentlichung. Der Ablauf selbst liegt in der Engine (docs/pakete.md).
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  spiel:
    uses: Mett-Gaming/mettgine/.github/workflows/spiel.yml@v0.21.0
    with:
      titel: "KASSE 0"
